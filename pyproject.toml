[project]
name = "sir-graph-emm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jarl Kusters", email = "dev@kusters.dev" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "mypy>=2.3.1",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.mypy]
strict = true
python_version = "3.12"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sir_graph"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
